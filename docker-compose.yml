services:
  db:
    image: postgres:17
    container_name: workly_database
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: workly_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  test_db:
    image: postgres:17
    container_name: test_database
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: test_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_test_db:/var/lib/postgresql/data


  backend:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: workly_backend
    restart: always
    depends_on:
      - db
    ports:
      - "8000:8000"
    environment:
      DB_URL: postgresql+asyncpg://postgres:postgres@db:5432/workly_db
    command: >
      sh -c "cd auth && python certs.py && cd .. &&
            cd shared && alembic upgrade head &&
            cd .. && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./app:/app
volumes:
  postgres_data:
  postgres_data_test_db:
